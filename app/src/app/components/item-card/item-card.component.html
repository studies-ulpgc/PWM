<div class="card-producto-cesta p-3">
  <div class="item-wrapper">
    <div class="checkbox-container">
      <ion-checkbox 
        [checked]="item.selected" 
        (ionChange)="onToggle()"
        aria-label="Seleccionar producto">
      </ion-checkbox>
    </div>

    <div class="img-container">
      <div class="img-placeholder" *ngIf="!item.img"></div>
      <img *ngIf="item.img" [src]="item.img" class="producto-img">
    </div>

    <div class="info-container">
      <h5 class="producto-titulo">{{ item.name }}</h5>
      <p class="producto-detalles">{{ item.opts }}</p>
      <p class="producto-precio">{{ item.price | currency:'EUR' }}</p>
    </div>

    <ion-button fill="clear" color="danger" (click)="onDelete()" class="btn-delete">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-button>
  </div>
</div>
