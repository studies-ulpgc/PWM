<div class="producto-container h-100 position-relative shadow-sm">
  <!-- Enlace al detalle: Ocupa toda la tarjeta -->
  <a [routerLink]="['/articulo-seleccionado', data?.id]" class="product-link text-decoration-none d-flex flex-column h-100 p-3">
    
    <!-- Imagen con Aspect Ratio controlado -->
    <div class="image-wrapper rounded-3 mb-3" 
         [style.backgroundImage]="'url(' + data?.fotoUrl + ')'">
    </div>

    <!-- Textos -->
    <div class="product-info d-flex flex-column gap-1">
      <div class="product-name text-dark text-truncate">
        {{ data?.nombre || 'Producto sin nombre' }}
      </div>
      
      <div class="product-price d-flex align-items-baseline gap-1 fw-bold text-dark">
        <ng-container *ngIf="data?.precioEntero; else precioDB">
          <span class="price-main">{{ data.precioEntero }}</span>
          <span class="price-decimal">.{{ data.precioDecimal || '00' }}€</span>
        </ng-container>
        
        <ng-template #precioDB>
          <span class="price-main">{{ data?.precio | currency:'EUR':'symbol':'1.2-2' }}</span>
        </ng-template>
      </div>
    </div>
  </a>

  <!-- Barra de acciones inferior (Flotante) -->
  <div class="action-bar position-absolute bottom-0 start-0 end-0 p-3 d-flex justify-content-between align-items-center">
    
    <div class="rating-stars text-dark" [style.visibility]="data?.Valoracion ? 'visible' : 'hidden'">
      @for (star of [1,2,3,4,5]; track star) {
        <i class="bi" [class.bi-star-fill]="star <= obtenerRating()" [class.bi-star]="star > obtenerRating()"></i>
      }
      <span class="ms-1 votes-count">({{ data?.Votos || 0 }})</span>
    </div>

    <div class="d-flex gap-2">
      <ion-button fill="clear" 
                  class="btn-action-minimal"
                  [class.is-selected]="enCesta"
                  [disabled]="!isLoggedIn"
                  (click)="toggleCesta(); $event.stopPropagation()">
        <ion-icon slot="icon-only" [name]="enCesta ? 'bag-check' : 'bag-add-outline'"></ion-icon>
      </ion-button>

      <ion-button fill="clear" 
                  class="btn-action-minimal"
                  [class.is-selected]="enDeseados"
                  [disabled]="!isLoggedIn"
                  (click)="toggleDeseados(); $event.stopPropagation()">
        <ion-icon slot="icon-only" [name]="enDeseados ? 'heart' : 'heart-outline'"></ion-icon>
      </ion-button>
    </div>
  </div>
</div>
