<section class="similares-wrapper mt-5 pt-5 border-top">
  <h3 class="section-title">Puede interesarte</h3>
  
  <div class="carrusel-nav-container">
    <ion-button fill="clear" class="nav-button prev" (click)="scroll(-1)" aria-label="Anterior">
      <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
    </ion-button>

    <div class="productos-scroll" #scrollContainer>
      <div class="producto-card-wrapper" *ngFor="let p of productosSimilares">
        <app-producto [data]="p"></app-producto>
      </div>
    </div>

    <ion-button fill="clear" class="nav-button next" (click)="scroll(1)" aria-label="Siguiente">
      <ion-icon slot="icon-only" name="chevron-forward-outline"></ion-icon>
    </ion-button>
  </div>
</section>
