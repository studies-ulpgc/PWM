<ion-header [translucent]="true">
  <app-header-grande></app-header-grande>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="cuenta-main-container">
    
    <section class="perfil-card">
      <div class="perfil-info-flex">
        <div class="avatar-wrapper" (click)="fileInput.click()">
          <img [src]="fotoPerfil" alt="Perfil" class="img-avatar">
          <div class="avatar-overlay">
            <ion-spinner *ngIf="subiendoImagen" name="crescent" color="light"></ion-spinner>
            <ion-icon *ngIf="!subiendoImagen" name="camera-outline"></ion-icon>
          </div>
        </div>
        <input type="file" #fileInput hidden accept="image/*" (change)="onFileSelected($event)">
        <h2 class="user-display-name">{{ userName }}</h2>
      </div>
      <ion-button fill="clear" color="dark" class="btn-edit-icon">
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-button>
    </section>

    <ion-grid class="stats-grid-container ion-no-padding">
      <ion-row class="stats-row">
        @for (stat of stats; track $index; let last = $last) {
          <ion-col size="4" class="stat-column" [class.with-border]="!last">
            <div class="stat-inner-box">
              <span class="stat-value">{{ stat.cifra }}</span>
              <span class="stat-label">{{ stat.etiqueta }}</span>
            </div>
          </ion-col>
        }
      </ion-row>
    </ion-grid>

    <section class="preferences-section">
      <h3 class="section-heading">Preferencias</h3>
      
      <div class="pref-block">
        <p class="pref-subtitle">Tipo de ropa:</p>
        <div class="chips-flex">
          @for (opcion of ropaOpciones; track opcion) {
            <ion-chip class="custom-square-chip">
              <ion-label>{{ opcion }}</ion-label>
            </ion-chip>
          }
        </div>
      </div>

      <div class="pref-block">
        <p class="pref-subtitle">Para quién:</p>
        <div class="chips-flex">
          @for (opcion of quienOpciones; track opcion) {
            <ion-chip class="custom-square-chip">
              <ion-label>{{ opcion }}</ion-label>
            </ion-chip>
          }
        </div>
      </div>
    </section>

    <div class="action-footer">
      <ion-button expand="block" routerLink="/mis-pedidos" class="black-button">
        Ir a mis pedidos
      </ion-button>
    </div>

  </div>

  <app-footer></app-footer>
</ion-content>
