<app-header-grande></app-header-grande>

<main class="container py-5 mt-4">
  
  <div class="row mb-4">
    <div class="col-12">
      <div class="input-group">
        <label class="input-group-text bg-light border-dark rounded-0 px-4 fw-bold text-uppercase" for="filterSelect">Filtrar</label>
        <select class="form-select border-dark rounded-0 py-3" id="filterSelect" [(ngModel)]="filterStatus" (change)="applyFilter()">
          <option value="Todos">Todos los pedidos</option>
          <option value="En envío">En envío</option>
          <option value="En ruta de entrega">En ruta de entrega</option>
          <option value="Entregado">Entregado</option>
        </select>
      </div>
    </div>
  </div>

  <div class="scroll-orders-container mb-5">
    <app-item-comprado 
      *ngFor="let order of filteredOrders" 
      [item]="order">
    </app-item-comprado>
    
    <div *ngIf="filteredOrders.length === 0" class="text-center py-5 border">
        <p class="text-muted">No se encontraron pedidos con el estado: {{filterStatus}}</p>
    </div>
  </div>

  <app-similares></app-similares>

</main>

<app-footer></app-footer>
