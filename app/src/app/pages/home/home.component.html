<ion-header [translucent]="true" ngSkipHydration>
  <app-header-grande></app-header-grande>
</ion-header>

<ion-content [fullscreen]="true" ngSkipHydration>
  <main class="home-container">
    <article class="content-wrapper">

      <section class="hero-carousel">
        <div class="animation-track">
          <div
            *ngFor="let item of carruselItems; trackBy: trackById"
            (click)="navegar(item.id)"
            class="hero-card"
            [style.backgroundImage]="'url(' + item.fotoUrl + ')'">
            <div class="overlay-info">
              <span>Descubrir colección</span>
            </div>
          </div>
        </div>
      </section>

      <section class="products-section">
        <div class="section-header">
          <h2>Trending</h2>
          <div class="line"></div>
        </div>
        
        <div class="products-grid">
          <app-producto 
            *ngFor="let prod of productos; trackBy: trackById" 
            [data]="prod"
            class="product-card-anim"
            >
          </app-producto>
        </div>
      </section>

      <app-footer></app-footer>
    </article>
  </main>
</ion-content>
