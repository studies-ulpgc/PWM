<ion-content [fullscreen]="true">
  <div class="container-fluid p-0">
    <div class="row g-0">

      <div class="col-md-6 d-none d-md-block p-0">
        <app-img-izq></app-img-izq>
      </div>

      <div class="col-md-6 d-flex align-items-center justify-content-center bg-white" style="min-height: 100vh;">
        <main class="w-75 py-5" style="max-width: 500px;">

          <div class="d-flex justify-content-center mb-5 border-bottom">
            <a href="#" class="nav-link active px-3 pb-2 border-bottom border-dark border-3 fw-bold text-dark">Iniciar Sesión</a>
            <a routerLink="/registrarse" class="nav-link px-3 pb-2 text-muted">Registrarse</a>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-4">
              <label class="form-label fw-semibold small">Correo</label>
              <input type="email" formControlName="email" class="form-control form-control-lg"
                     placeholder="ejemplo@correo.com"
                     [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
              @if (loginForm.get('email')?.errors?.['required']){
                  <div class="invalid-feedback"> El correo es obligatorio.</div>
              }
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold small">Contraseña</label>
              <div class="input-group input-group-lg">
                <input [type]="verContrasena ? 'text' : 'password'"
                       formControlName="password"
                       class="form-control"
                       placeholder="********"
                       [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">

                <button class="btn btn-outline-secondary d-flex align-items-center" type="button" (click)="togglePassword()">
                  <i class="bi" [ngClass]="verContrasena ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
              </div>
              @if (loginForm.get('password')?.errors?.['required']){
                <small class="text-danger small">La contraseña es obligatoria.</small>
              }
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label small" for="remember">Recordar credenciales</label>
              </div>
              <a href="#" class="small text-dark text-decoration-underline fw-medium">¿Olvidó la contraseña?</a>
            </div>

            <button type="submit" class="btn btn-dark w-100 py-3 fw-bold shadow-sm" [disabled]="loginForm.invalid">
              Iniciar Sesión
            </button>

            <div class="d-flex align-items-center my-5 text-muted">
              <hr class="flex-grow-1">
              <span class="mx-3 small fw-bold">o</span>
              <hr class="flex-grow-1">
            </div>

            <button (click)="loginGoogle()" type="button" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-google"></i> Google
            </button>
          </form>
        </main>
      </div>

    </div>
  </div>
</ion-content>
