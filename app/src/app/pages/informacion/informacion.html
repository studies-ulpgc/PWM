<app-header-grande></app-header-grande>

<main class="container py-5">
  <h1 class="text-center fw-bold mb-5" *ngIf="tituloPagina">{{ tituloPagina }}</h1>

  <div *ngFor="let bloque of contenido">
    
    <section *ngIf="bloque.__component === 'info.bloque-texto'" 
             class="bloque-gris p-4 p-md-5 mb-5 text-center">
      <p class="fs-5">{{ bloque.cuerpo }}</p>
    </section>

    <section *ngIf="bloque.__component === 'info.seccion-destacada'" 
             class="bloque-gris p-4 p-md-5 mb-5 shadow-sm">
      <div class="row align-items-center g-4">
        
        <div class="col-md-4" *ngIf="bloque.imagen">
          <div class="img-cuadrada-oscura shadow-sm" 
               [style.background-image]="'url(' + bloque.imagen.url + ')'"
               style="background-size: cover; background-position: center;">
          </div>
        </div>

        <div [ngClass]="bloque.imagen ? 'col-md-8 px-md-4' : 'col-12'">
          <h2 class="fw-bold mb-4" *ngIf="bloque.imagen?.titulo">{{ bloque.imagen.titulo }}</h2>
          <p class="fs-5">{{ bloque.descripcion }}</p>
        </div>
      </div>
    </section>

  </div>
</main>

<app-footer></app-footer>
